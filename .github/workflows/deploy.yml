name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t deepscan-ai:${{ github.sha }} \
            -t deepscan-ai:latest \
            .

      - name: Stop old container
        run: docker stop deepscan-ai || true

      - name: Remove old container
        run: docker rm deepscan-ai || true

      - name: Run new container
        run: |
          docker run -d \
            --name deepscan-ai \
            --restart always \
            -p 127.0.0.1:5002:5002 \
            deepscan-ai:latest
